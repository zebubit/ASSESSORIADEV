<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diana · Atendente Spa Diamond</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --preto:#0B0B0B; --carvao:#141210; --caixa:#1B1815; --caixa2:#221E19;
  --ouro:#C9A227; --ouro-lt:#E8C766; --linha:rgba(201,162,39,.22);
  --creme:#F3EDE2; --txt:#EDE7DC; --mut:#A79E90;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:Jost,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--preto);color:var(--txt);
  font:300 16px/1.7 var(--sans);
  min-height:100dvh;display:flex;flex-direction:column;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(70vw 55vh at 50% -12%, rgba(201,162,39,.13), transparent 62%),
    radial-gradient(50vw 40vh at 90% 108%, rgba(201,162,39,.07), transparent 60%);
}
.wrap{position:relative;z-index:1;width:min(720px,calc(100% - 32px));margin-inline:auto;
  flex:1;display:flex;flex-direction:column;padding:26px 0 34px}

/* topo */
.topo{text-align:center;flex:none}
.marca b{display:block;font-family:var(--serif);font-size:1.65rem;font-weight:600;
  color:var(--ouro-lt);letter-spacing:.03em;line-height:1}
.marca small{display:block;font-size:.72rem;font-weight:500;letter-spacing:.34em;
  text-transform:uppercase;color:var(--mut);margin-top:6px}
.selo{display:inline-flex;align-items:center;gap:9px;margin-top:20px;
  font-size:.68rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--ouro)}
.selo::before,.selo::after{content:"";width:26px;height:1px;background:var(--ouro);opacity:.55}
h1{font-family:var(--serif);font-size:clamp(1.9rem,5.6vw,2.7rem);font-weight:600;
  color:var(--creme);line-height:1.12;margin:12px 0 8px;text-wrap:balance}
h1 em{font-style:italic;color:var(--ouro-lt)}
.sub{color:var(--mut);font-size:.96rem;max-width:44ch;margin-inline:auto}

/* conversa */
.conversa{
  flex:1;margin:26px 0 20px;padding:22px;border-radius:20px;
  background:linear-gradient(180deg,var(--caixa) 0%,var(--carvao) 100%);
  border:1px solid var(--linha);
  display:flex;flex-direction:column;gap:16px;
  overflow-y:auto;min-height:220px;max-height:46vh;
  scroll-behavior:auto;
}
.fala{display:flex;gap:12px;align-items:flex-start;animation:sobe .34s ease both}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fala .quem{
  flex:none;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;font-size:.68rem;font-weight:600;letter-spacing:.06em;
}
.fala.ela .quem{background:linear-gradient(135deg,var(--ouro-lt),var(--ouro));color:#191305}
.fala.voce .quem{background:var(--caixa2);border:1px solid var(--linha);color:var(--mut)}
.fala .quem svg{display:block}
.fala .txt{font-size:1rem;line-height:1.65;padding-top:5px}
.fala.ela .txt{color:var(--creme)}
.fala.voce .txt{color:var(--mut)}
.vazio{text-align:center;color:var(--mut);font-size:.94rem;margin:auto;max-width:30ch;line-height:1.8}
.vazio b{display:block;color:var(--ouro-lt);font-family:var(--serif);
  font-size:1.3rem;font-weight:600;margin-bottom:8px}

/* pensando */
.pensando{display:flex;gap:5px;align-items:center;padding-top:12px}
.pensando i{width:6px;height:6px;border-radius:50%;background:var(--ouro);
  animation:pisca 1.3s infinite ease-in-out}
.pensando i:nth-child(2){animation-delay:.18s}
.pensando i:nth-child(3){animation-delay:.36s}
@keyframes pisca{0%,60%,100%{opacity:.25;transform:scale(.82)}30%{opacity:1;transform:scale(1)}}

/* controle */
.controle{flex:none;display:flex;flex-direction:column;align-items:center;gap:16px}
.mic{
  position:relative;width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--ouro-lt),var(--ouro));color:#191305;
  display:grid;place-items:center;
  transition:transform .22s ease,box-shadow .22s ease,background .22s ease;
  box-shadow:0 10px 34px rgba(201,162,39,.24);
}
.mic:hover{transform:translateY(-2px)}
.mic:active{transform:scale(.96)}
.mic svg{width:34px;height:34px}
.mic:focus-visible{outline:3px solid var(--ouro-lt);outline-offset:5px}
.mic.ouvindo{background:linear-gradient(135deg,#e05c5c,#b93636);color:#fff}
.mic.ouvindo::after{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid rgba(224,92,92,.55);animation:pulso 1.5s infinite ease-out
}
@keyframes pulso{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.28);opacity:0}}
.mic.falando{background:var(--caixa2);color:var(--ouro-lt);box-shadow:none;
  border:1px solid var(--linha)}
.mic[disabled]{opacity:.42;cursor:default;transform:none}
.dica{font-size:.86rem;color:var(--mut);text-align:center;min-height:1.6em;letter-spacing:.02em}
.dica b{color:var(--ouro-lt);font-weight:500}

/* digitar */
.digitar{display:flex;gap:9px;width:100%;max-width:470px}
.digitar input{
  flex:1;min-height:48px;padding:12px 18px;border-radius:99px;
  background:var(--caixa);border:1px solid var(--linha);color:var(--txt);
  font:300 .96rem var(--sans);
}
.digitar input::placeholder{color:#6f675c}
.digitar input:focus{outline:none;border-color:var(--ouro);background:var(--caixa2)}
.digitar button{
  min-height:48px;padding:0 22px;border-radius:99px;border:1px solid var(--linha);
  background:transparent;color:var(--ouro-lt);font:500 .84rem var(--sans);
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s
}
.digitar button:hover{background:rgba(201,162,39,.1)}

.zap{
  display:inline-flex;align-items:center;gap:10px;margin-top:14px;
  min-height:50px;padding:13px 26px;border-radius:99px;
  background:#0e7a3e;color:#fff;font:500 .84rem var(--sans);
  letter-spacing:.11em;text-transform:uppercase;text-decoration:none;
  box-shadow:0 8px 26px rgba(14,122,62,.3);
  animation:surge .45s ease both;
}
.zap:hover{background:#0b6b35}
.zap svg{width:19px;height:19px;flex:none}
@keyframes surge{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.zap-nota{display:block;margin-top:7px;font-size:.78rem;color:var(--mut);line-height:1.5;max-width:34ch}

.rodape{flex:none;text-align:center;margin-top:22px;font-size:.72rem;
  color:#5f584f;letter-spacing:.18em;text-transform:uppercase}
.aviso{
  display:none;margin:14px 0 0;padding:13px 17px;border-radius:12px;
  background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);
  color:#e6a19a;font-size:.88rem;line-height:1.6;text-align:center
}
.aviso.ver{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <header class="topo">
    <div class="marca">
      <b>Spa Diamond</b>
      <small>La Evidence</small>
    </div>
    <div class="selo">Atendimento por voz</div>
    <h1>Fale com a <em>Diana</em></h1>
    <p class="sub">Aperte o botão, faça a sua pergunta em voz alta e ela responde falando com você.</p>
  </header>

  <main class="conversa" id="conversa" aria-live="polite">
    <div class="vazio" id="vazio">
      <b>Toque no microfone</b>
      Pergunte sobre os métodos, a mentoria ou como agendar a sua avaliação.
    </div>
  </main>

  <div class="aviso" id="aviso"></div>

  <div class="controle">
    <button class="mic" id="mic" aria-label="Falar com a Diana">
      <svg id="icMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none"/>
        <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8 22h8"/>
      </svg>
      <svg id="icStop" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <rect x="6" y="6" width="12" height="12" rx="2.5"/>
      </svg>
    </button>
    <p class="dica" id="dica">Toque para falar</p>

    <form class="digitar" id="form">
      <input id="campo" type="text" placeholder="ou escreva a sua pergunta aqui" autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </div>

  <p class="rodape">Demonstração · Zebubit Assessoria</p>
</div>

<script>
const API = 'https://n8n.dionefolador.com/webhook/spa-diamond-voz';
const SESSAO = 'demo-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

const elConversa = document.getElementById('conversa');
const elVazio    = document.getElementById('vazio');
const elMic      = document.getElementById('mic');
const elDica     = document.getElementById('dica');
const elAviso    = document.getElementById('aviso');
const elCampo    = document.getElementById('campo');
const icMic      = document.getElementById('icMic');
const icStop     = document.getElementById('icStop');

let ouvindo = false, ocupado = false, vozEscolhida = null;

/* ---------- escolher a melhor voz em portugues ---------- */
function escolherVoz(){
  const vozes = speechSynthesis.getVoices().filter(v => /pt[-_]?BR/i.test(v.lang));
  if(!vozes.length) return null;
  const preferidas = ['Luciana','Google português do Brasil','Francisca','Microsoft Maria','Joana'];
  for(const nome of preferidas){
    const achou = vozes.find(v => v.name.includes(nome));
    if(achou) return achou;
  }
  return vozes.find(v => /female|mulher|maria|ana|luci/i.test(v.name)) || vozes[0];
}
speechSynthesis.onvoiceschanged = () => { vozEscolhida = escolherVoz(); };
vozEscolhida = escolherVoz();

/* ---------- falar ---------- */
let tocando = null;

function falarComSistema(texto){
  return new Promise(resolve => {
    if(!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const f = new SpeechSynthesisUtterance(texto);
    f.lang = 'pt-BR';
    if(vozEscolhida) f.voice = vozEscolhida;
    f.rate = 1.02; f.pitch = 1.06;
    f.onend = resolve; f.onerror = resolve;
    speechSynthesis.speak(f);
  });
}

function falarComAudio(base64){
  return new Promise(resolve => {
    try{
      const a = new Audio('data:audio/mpeg;base64,' + base64);
      tocando = a;
      a.onended = () => { tocando = null; resolve(); };
      a.onerror = () => { tocando = null; resolve(); };
      a.play().catch(() => { tocando = null; resolve(); });
    }catch(e){ tocando = null; resolve(); }
  });
}

async function falar(texto, audio){
  if(!audio) return;           // quem escreveu recebe resposta escrita
  estado('falando');
  await falarComAudio(audio);
}

function calar(){
  if(tocando){ tocando.pause(); tocando = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

/* ---------- tela ---------- */
function estado(qual){
  elMic.classList.remove('ouvindo','falando');
  icMic.style.display = 'block'; icStop.style.display = 'none';
  elMic.disabled = false;
  if(qual === 'ouvindo'){
    elMic.classList.add('ouvindo');
    icMic.style.display = 'none'; icStop.style.display = 'block';
    elDica.innerHTML = '<b>Estou ouvindo</b> · pode falar';
  } else if(qual === 'pensando'){
    elMic.disabled = true;
    elDica.textContent = 'Pensando na resposta';
  } else if(qual === 'falando'){
    elMic.classList.add('falando');
    elDica.innerHTML = '<b>Diana está falando</b> · toque para interromper';
  } else {
    elDica.textContent = 'Toque para falar';
  }
}

function botaoZap(dados){
  const a = document.createElement('a');
  a.className = 'zap';
  a.href = dados.link;
  a.target = '_blank';
  a.rel = 'noopener';
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor">'
    + '<path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-1.7-.9-2.9-1.6-4-3.6-.3-.5.3-.5.8-1.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.5.7.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.5-.4z"/>'
    + '<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/>'
    + '</svg>Falar no WhatsApp';
  const caixa = document.createElement('div');
  caixa.appendChild(a);
  const nota = document.createElement('small');
  nota.className = 'zap-nota';
  nota.textContent = 'A conversa já vai com a sua mensagem escrita.';
  caixa.appendChild(nota);
  return caixa;
}

function escrever(quem, texto){
  if(elVazio) elVazio.remove();
  const d = document.createElement('div');
  d.className = 'fala ' + quem;
  const avatar = quem === 'ela'
    ? 'D'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width:16px;height:16px"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
  d.innerHTML = '<div class="quem">' + avatar + '</div><div class="txt"></div>';
  d.querySelector('.txt').textContent = texto;
  elConversa.appendChild(d);
  elConversa.scrollTop = elConversa.scrollHeight;
  return d;
}

function avisar(txt){
  elAviso.textContent = txt;
  elAviso.classList.add('ver');
}

/* ---------- conversar ---------- */
async function perguntar(texto, modo){
  if(!texto || ocupado) return;
  modo = modo || 'texto';
  ocupado = true;
  escrever('voce', texto);
  estado('pensando');

  const carregando = document.createElement('div');
  carregando.className = 'fala ela';
  carregando.innerHTML = '<div class="quem">D</div>'
    + '<div class="pensando"><i></i><i></i><i></i></div>';
  elConversa.appendChild(carregando);
  elConversa.scrollTop = elConversa.scrollHeight;

  try{
    const r = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ mensagem: texto, sessao: SESSAO, modo: modo })
    });
    const dados = await r.json();
    carregando.remove();
    const resposta = (dados.resposta || '').trim()
      || 'Desculpe, não consegui responder agora. Pode repetir?';
    const bloco = escrever('ela', resposta);
    if(dados.whatsapp && dados.whatsapp.link){
      bloco.querySelector('.txt').appendChild(botaoZap(dados.whatsapp));
      elConversa.scrollTop = elConversa.scrollHeight;
    }
    await falar(resposta, dados.audio);
  }catch(e){
    carregando.remove();
    escrever('ela', 'Tive um problema de conexão agora. Tenta de novo?');
    avisar('Não consegui falar com o servidor. Verifique a internet e tente novamente.');
  }
  ocupado = false;
  estado('parado');
}

/* ---------- enviar o que foi escrito ---------- */
document.getElementById('form').addEventListener('submit', (ev) => {
  ev.preventDefault();                 // sem isto a pagina recarrega e a conversa some
  const txt = elCampo.value.trim();
  if(!txt) return;
  elCampo.value = '';
  perguntar(txt, 'texto');
});

/* ---------- gravar áudio de verdade ---------- */
let gravador = null, pedacos = [], gravando = false, faixa = null, inicio = 0;

if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder){
  elMic.disabled = false;
} else {
  avisar('Este navegador não grava áudio. Use o Google Chrome para falar, ou escreva a sua pergunta no campo abaixo.');
  elMic.disabled = true;
}

function tipoSuportado(){
  const tipos = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  for(const t of tipos){ if(MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}

function pararTudo(){
  if(faixa){ faixa.getTracks().forEach(t => t.stop()); faixa = null; }
  gravando = false;
  estado('parado');
}

async function enviarAudio(base64, mimeType){
  if(ocupado) return;
  ocupado = true;
  const minha = escrever('voce', 'Áudio enviado');
  estado('pensando');

  const carregando = document.createElement('div');
  carregando.className = 'fala ela';
  carregando.innerHTML = '<div class="quem">D</div><div class="pensando"><i></i><i></i><i></i></div>';
  elConversa.appendChild(carregando);
  elConversa.scrollTop = elConversa.scrollHeight;

  try{
    const r = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ audio: base64, mimeType: mimeType, sessao: SESSAO })
    });
    const dados = await r.json();
    carregando.remove();
    if(dados.ouvido) minha.querySelector('.txt').textContent = dados.ouvido;
    const resposta = (dados.resposta || '').trim() || 'Não consegui entender o áudio. Pode repetir?';
    const bloco = escrever('ela', resposta);
    if(dados.whatsapp && dados.whatsapp.link){
      bloco.querySelector('.txt').appendChild(botaoZap(dados.whatsapp));
      elConversa.scrollTop = elConversa.scrollHeight;
    }
    await falar(resposta, dados.audio);
  }catch(e){
    carregando.remove();
    escrever('ela', 'Tive um problema de conexão agora. Tenta de novo?');
    avisar('Não consegui falar com o servidor. Verifique a internet e tente novamente.');
  }
  ocupado = false;
  estado('parado');
}

async function comecarGravacao(){
  try{
    faixa = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    avisar('Preciso da sua permissão para usar o microfone. Toque no cadeado ao lado do endereço do site, libere o microfone e recarregue a página. Enquanto isso, você pode escrever a pergunta abaixo.');
    return;
  }
  const tipo = tipoSuportado();
  try{
    gravador = tipo ? new MediaRecorder(faixa, { mimeType: tipo }) : new MediaRecorder(faixa);
  }catch(e){
    pararTudo();
    avisar('Este navegador não conseguiu gravar áudio. Escreva a sua pergunta no campo abaixo.');
    return;
  }
  pedacos = [];
  inicio = Date.now();
  gravador.ondataavailable = ev => { if(ev.data && ev.data.size) pedacos.push(ev.data); };
  gravador.onstop = () => {
    const dur = Date.now() - inicio;
    const blob = new Blob(pedacos, { type: gravador.mimeType || 'audio/webm' });
    pararTudo();
    if(dur < 700 || blob.size < 1200){
      elDica.textContent = 'Segure um instante a mais para gravar';
      return;
    }
    const leitor = new FileReader();
    leitor.onloadend = () => {
      const base64 = String(leitor.result).split(',')[1];
      enviarAudio(base64, (gravador.mimeType || 'audio/webm').split(';')[0]);
    };
    leitor.readAsDataURL(blob);
  };
  gravador.start();
  gravando = true;
  estado('ouvindo');
  elDica.innerHTML = '<b>Gravando</b> · toque de novo para enviar';
}

elMic.addEventListener('click', () => {
  if(tocando || (('speechSynthesis' in window) && speechSynthesis.speaking)){ calar(); estado('parado'); return; }
  if(ocupado) return;
  if(gravando){
    if(gravador && gravador.state === 'recording') gravador.stop();
    else pararTudo();
    return;
  }
  comecarGravacao();
});

estado('parado');
</script>
</body>
</html>
